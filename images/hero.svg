<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360">
  <!-- chalkboard -->
  <rect x="40" y="20" width="380" height="230" rx="12" fill="#123a63"/>
  <rect x="58" y="38" width="344" height="194" rx="6" fill="#0e2f52"/>
  <text x="80" y="90" font-family="Georgia, serif" font-size="30" fill="#f2a900">y = mx + b</text>
  <text x="80" y="135" font-family="Georgia, serif" font-size="30" fill="#ffffff">a&#178; + b&#178; = c&#178;</text>
  <text x="80" y="180" font-family="Georgia, serif" font-size="30" fill="#f2a900">&#8747; f(x) dx</text>
  <line x1="70" y1="205" x2="180" y2="205" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  <line x1="200" y1="205" x2="330" y2="205" stroke="#ffffff" stroke-width="2" opacity="0.4"/>

  <!-- desk -->
  <rect x="0" y="290" width="460" height="20" fill="#d7dce3"/>
  <rect x="20" y="250" width="420" height="45" rx="6" fill="#e9edf2"/>

  <!-- student (simple flat figure) -->
  <circle cx="330" cy="215" r="24" fill="#f0c29a"/>
  <path d="M300 250 q30 -30 60 0 l0 40 -60 0 z" fill="#1565c0"/>
  <rect x="310" y="250" width="40" height="18" fill="#f4f6f9"/>

  <!-- book -->
  <rect x="300" y="260" width="55" height="10" rx="2" fill="#f2a900"/>
</svg>
